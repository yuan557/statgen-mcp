# ~/.statgen-mcp/config.toml
# Copy this file to ~/.statgen-mcp/config.toml and edit as needed.

# Where to write run outputs (timestamped subdirectories per job)
output_dir = "~/statgen-mcp-runs"

[executor]
# Options: local | slurm
backend = "local"

[tools]
# Full paths if binaries are not on PATH, e.g. "/usr/local/bin/plink2"
plink2 = "plink2"
bcftools = "bcftools"  # required for VCF variant source filtering


# Uncomment when using SLURM
# [slurm]
# partition = "normal"
# account = "myaccount"        # required on some clusters
# time = "04:00:00"            # wall time limit (HH:MM:SS)
# default_memory = "16G"
# default_cpus = 4
# poll_interval = 30           # seconds between squeue checks
# max_wait = 86400             # give up after 24h


# Uncomment when using AWS Batch
# [aws]
# region = "us-east-1"
# job_queue = "statgen-queue"
# job_definition = "statgen-plink2"
