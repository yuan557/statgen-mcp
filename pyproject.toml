[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "statgen-mcp"
version = "0.1.0"
description = "MCP server exposing PLINK2 and bcftools as tools for agentic GWAS pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0",
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.scripts]
statgen-mcp = "statgen_mcp.server:main"

[project.optional-dependencies]
plots = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "seaborn>=0.13",
]
llm = ["openai>=1.0"]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/statgen_mcp"]

[tool.ruff]
line-length = 100
